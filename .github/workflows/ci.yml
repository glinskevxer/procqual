name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    name: test on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.2', '22.13.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run coverage

  security:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: npm
      - run: npm ci
      - run: node scripts/audit-dependencies.mjs

  image:
    name: build and run the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: arc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
      - name: the command line answers inside the image
        run: node scripts/image-check.mjs arc:ci

  smoke:
    name: the command line works when installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/smoke.mjs
      - run: node scripts/reference.mjs --check
